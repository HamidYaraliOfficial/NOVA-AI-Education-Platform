spring:
  application:
    name: nova-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nova}
    username: ${DB_USER:nova}
    password: ${DB_PASSWORD:nova}
    hikari:
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 32

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

server:
  port: 8080
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

nova:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-please-use-a-long-random-value}
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 30
  object-storage:
    endpoint: ${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
    bucket: ${OBJECT_STORAGE_BUCKET:nova-media}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:minioadmin}
  ai:
    provider: ${AI_PROVIDER:anthropic} # anthropic | openai | local
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:claude-sonnet-5}
    base-url: ${AI_BASE_URL:https://api.anthropic.com}
  code-execution:
    timeout-seconds: 8
    memory-limit-mb: 256
    docker-image-prefix: nova-sandbox
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /docs
